name: PR Conventions

# Conventional Commits feed the auto-generated release notes and the next-version
# suggestion (Scripts/compute-version.sh --mode next-tag). The repo squash-merges
# only, so the PR title is what lands on main; branch commit subjects never do.
# They are checked anyway, to keep the convention a habit for people and coding
# agents alike — the commit-msg hook in .githooks/ catches them at commit time,
# and this job is the backstop for --no-verify and clones without the hook.
# Both jobs share the rule in Scripts/lint-commit-subject.sh.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: Scripts

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        # Strict: no git-generated subjects, since the title becomes the commit on main.
        run: Scripts/lint-commit-subject.sh -- "$PR_TITLE"

  lint-commits:
    name: Conventional Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: Scripts

      - name: Validate commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Merge commits (>1 parent) are skipped; --jq runs per page, so --paginate is safe.
          mapfile -t subjects < <(
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
              --jq '.[] | select((.parents | length) < 2) | .commit.message | split("\n")[0]'
          )
          if [[ ${#subjects[@]} -eq 0 ]]; then
            echo "::error::Could not read any commits for PR #$PR_NUMBER."
            exit 1
          fi
          Scripts/lint-commit-subject.sh --git-workflow -- "${subjects[@]}"
