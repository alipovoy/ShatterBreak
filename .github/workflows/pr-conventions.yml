name: PR Conventions

# Every commit subject and the PR title must be a Conventional Commit, so history
# reads canonically on whatever branch it lands and however it is merged. The
# PR title also feeds the next-version suggestion (Scripts/compute-version.sh
# --mode next-tag) when squash-merging. The commit-msg hook in .githooks/ catches
# bad subjects at commit time; these jobs are the backstop for --no-verify and
# clones without the hook. Merge commits are skipped. The rule itself lives in
# Scripts/lint-commit-subject.sh.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: Scripts
          persist-credentials: false

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "The PR title becomes the commit subject when squash-merging."
          Scripts/lint-commit-subject.sh -- "$PR_TITLE"

  lint-commits:
    name: Conventional Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: Scripts
          persist-credentials: false

      - name: Validate commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Merge commits (>1 parent) are skipped; --jq runs per page, so --paginate is safe.
          mapfile -t subjects < <(
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
              --jq '.[] | select((.parents | length) < 2) | .commit.message | split("\n")[0]'
          )
          if [[ ${#subjects[@]} -eq 0 ]]; then
            echo "::error::Could not read any commits for PR #$PR_NUMBER."
            exit 1
          fi
          Scripts/lint-commit-subject.sh -- "${subjects[@]}"
